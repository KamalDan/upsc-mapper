<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Mains Syllabus & PYQ Automated Mapper (Offline)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-indigo-900 text-white p-4 flex flex-col md:flex-row justify-between items-center gap-3 shadow-md">
        <div>
            <h1 class="text-xl font-bold">UPSC Mains PYQ Offline Mapper</h1>
            <p class="text-xs text-indigo-200">100% Offline • Zero API Dependencies • Instant Retrieval</p>
        </div>
        <div>
            <span class="bg-emerald-500 text-white text-xs px-2.5 py-1 rounded-full font-semibold">Offline Mode Active</span>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-1/4 bg-white border-r border-gray-200 overflow-y-auto p-4 max-h-60 md:max-h-full">
            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">Pre-Loaded Syllabus</h2>
            <div id="syllabusMenu" class="space-y-4"></div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 md:p-6 overflow-y-auto bg-gray-50">
            <div id="welcomeMessage" class="bg-white p-8 rounded-lg shadow border border-gray-200 text-center">
                <h3 class="text-xl font-semibold text-gray-800 mb-2">Select a Topic from the Syllabus</h3>
                <p class="text-sm text-gray-600">Choose any topic from the left menu to view instant mapped PYQs, core dimensions, and recurrent themes.</p>
            </div>

            <div id="output" class="hidden bg-white p-6 md:p-8 rounded-lg shadow border border-gray-200 prose max-w-none">
                <!-- Offline content renders here instantly -->
            </div>
        </main>
    </div>

    <script>
        // Static local database of mapped PYQs & syllabus insights
        const pyqDatabase = {
            "GS Paper 1": {
                "Indian Art, Architecture & Culture": {
                    themes: ["Temple Architecture Styles (Nagara vs Dravida)", "Buddhism & Jainism Art and Philosophy", "Bhakti & Sufi Movement Impact", "Gupta & Maurya Golden Age Architecture"],
                    dimensions: ["Socio-cultural reflection through architecture", "Foreign influences on Indian art forms", "Evolution of rock-cut vs structural architecture"],
                    pyqs: [
                        { year: 2023, marks: "10 Marks", text: "Explain the role of the Bhakti movement in the growth of regional languages in India." },
                        { year: 2022, marks: "15 Marks", text: "How will you explain that the medieval Indian temple sculptures represent the social life of those days?" },
                        { year: 2021, marks: "10 Marks", text: "Evaluate the nature of the Bhakti literature and its contribution to Indian culture." },
                        { year: 2020, marks: "15 Marks", text: "Rock-cut architecture represents one of the most important sources of our knowledge of early Indian art and history. Discuss." },
                        { year: 2018, marks: "10 Marks", text: "Assess the importance of the accounts of the Chinese travellers in the reconstruction of the history of India." }
                    ]
                },
                "Modern Indian History & Freedom Struggle": {
                    themes: ["Role of 19th Century Socio-Religious Movements", "Gandhian Mass Movements (NCM, CDM, QIM)", "Constitutional Developments (1919, 1935 Acts)", "Tribal & Peasant Uprisings"],
                    dimensions: ["Ideological clashes (Moderate vs Extremist, Gandhi vs Bose vs Ambedkar)", "Role of women and working class in freedom movement", "Economic critique of British colonialism"],
                    pyqs: [
                        { year: 2023, marks: "15 Marks", text: "What was the difference between Mahatma Gandhi and Rabindranath Tagore in their approach towards education and nationalism?" },
                        { year: 2022, marks: "10 Marks", text: "Why was there an uprising in 1857? Main causes, nature, and consequences." },
                        { year: 2021, marks: "15 Marks", text: "Bring out the socio-economic effects of the introduction of railways in different states of India during the 19th century." },
                        { year: 2019, marks: "10 Marks", text: "The 1857 Uprising was the culmination of the recurrent big and small local rebellions that had occurred in the preceding hundred years. Elucidate." }
                    ]
                },
                "Physical Geography & Natural Resources Distribution": {
                    themes: ["Plate Tectonics, Volcanism & Earthquakes", "Monsoon Mechanism & El Niño/La Niña", "Resource Distribution (Iron, Coal, Rare Earth)", "Cyclones (Tropical vs Temperate)"],
                    dimensions: ["Impact of climate change on natural resource availability", "Geopolitical aspects of critical minerals", "Disaster vulnerability mapping"],
                    pyqs: [
                        { year: 2023, marks: "15 Marks", text: "Comment on the resource potentials of the Long Coastline of India and highlight the status of natural disaster preparedness in these areas." },
                        { year: 2022, marks: "10 Marks", text: "What are the forces that influence ocean currents? Describe their role in the fishing industry of the world." },
                        { year: 2021, marks: "15 Marks", text: "Differentiate between Tropical and Temperate cyclones with suitable examples." }
                    ]
                }
            },
            "GS Paper 2": {
                "Constitutional Amendments & Basic Structure": {
                    themes: ["Evolution of Basic Structure Doctrine (Kesavananda Bharati to Present)", "Major Amendments (42nd, 44th, 73rd, 74th, 101st, 103rd, 106th)", "Judicial Review vs Legislative Supremacy", "Flexibility vs Rigidity of the Constitution"],
                    dimensions: ["Impact of amendments on federal equilibrium", "Fundamental Rights vs Directive Principles dynamics", "Judicial activism and constitutional morals"],
                    pyqs: [
                        { year: 2023, marks: "15 Marks", text: "Analyze the significance of the Constitution (One Hundred and Sixth Amendment) Act, 2023 regarding women's reservation." },
                        { year: 2022, marks: "10 Marks", text: "Discuss the essential conditions for the exercise of the legislative powers by the Governor under Article 213 of the Constitution." },
                        { year: 2021, marks: "15 Marks", text: "Do you agree that the Indian Constitution is federal in form but unitary in spirit? Give reasons." },
                        { year: 2019, marks: "15 Marks", text: "Explain the doctrine of basic structure as enunciated by the Supreme Court in the Kesavananda Bharati case." }
                    ]
                },
                "Issues of Federalism & Centre-State Relations": {
                    themes: ["Role of Governor & Article 356", "Fiscal Federalism & Finance Commission", "Inter-State Water Disputes & Councils", "Centrally Sponsored Schemes & Autonomy"],
                    dimensions: ["Cooperative vs Competitive vs Confrontational Federalism", "Impact of GST on state fiscal autonomy", "Asymmetric federalism in India"],
                    pyqs: [
                        { year: 2023, marks: "15 Marks", text: "Account for the rising instances of friction between Governors and elected Chief Ministers in recent times." },
                        { year: 2022, marks: "10 Marks", text: "How far do you think the Finance Commission helps in resolving fiscal imbalances between Union and States?" },
                        { year: 2020, marks: "15 Marks", text: "The Indian Constitution has centralizing tendencies to meet the imperative needs of national unity and growth. Comment." }
                    ]
                }
            },
            "GS Paper 3": {
                "Indian Economy & Mobilization of Resources": {
                    themes: ["GDP Growth, Inflation & Monetary Policy", "Jobless Growth & Informal Sector Transition", "Banking Sector Reform & NPA Resolution", "Capital Formation & Investment Cycle"],
                    dimensions: ["Structural transformations in the post-reform era", "Financial inclusion and digital economy", "Income inequality and wealth distribution"],
                    pyqs: [
                        { year: 2023, marks: "15 Marks", text: "Faster economic growth requires increased share of the manufacturing sector in GDP, particularly of MSMEs. Comment in the context of Indian economy." },
                        { year: 2022, marks: "10 Marks", text: "Do you agree that the Indian economy has recently experienced V-shaped recovery? Give reasons in support of your answer." },
                        { year: 2021, marks: "15 Marks", text: "Explain the difference between computing methodology of GDP before 2015 and after 2015." }
                    ]
                },
                "Disaster & Disaster Management": {
                    themes: ["Sendai Framework & NDMA Guidelines", "Urban Floods & Heatwaves", "Landslides & Glacial Lake Outburst Floods (GLOF)", "Community-Based Disaster Preparedness"],
                    dimensions: ["Climate change adaptation vs mitigation", "Financing disaster response (NDRF/SDRF)", "Early Warning Systems technology integration"],
                    pyqs: [
                        { year: 2023, marks: "10 Marks", text: "Discuss the consequences of Climate Change on food security in tropical countries." },
                        { year: 2022, marks: "15 Marks", text: "Explain the mechanism and causes of cloudbursts with examples of recent instances in India." },
                        { year: 2021, marks: "10 Marks", text: "Describe the various causes and the effects of landslides. Mention the important components of the National Landslide Risk Management Strategy." }
                    ]
                }
            },
            "GS Paper 4": {
                "Ethics and Human Interface: Essence, Determinants & Consequences": {
                    themes: ["Ethics in Personal vs Public Relationships", "Determinants and Consequences of Human Action", "Dimensions of Ethics (Meta, Normative, Applied)", "Human Values & Moral Intuition"],
                    dimensions: ["Conflict between institutional rules and conscience", "Role of family, society, and educational institutions in inculcating values"],
                    pyqs: [
                        { year: 2023, marks: "10 Marks", text: "What does ethics seek to promote in human life? How is it necessary in public administration?" },
                        { year: 2022, marks: "10 Marks", text: "Wisdom lies in knowing what to reckon with and what to dispense with. Discuss in the context of public service." },
                        { year: 2020, marks: "10 Marks", text: "What do you understand by 'moral accountability'? Discuss with examples." }
                    ]
                }
            }
        };

        // Render Menu Navigation
        const menuContainer = document.getElementById("syllabusMenu");
        for (const [paper, topics] of Object.entries(pyqDatabase)) {
            const paperHeader = document.createElement("details");
            paperHeader.className = "group mb-2";
            paperHeader.open = true;

            const summary = document.createElement("summary");
            summary.className = "flex justify-between items-center font-bold text-gray-800 cursor-pointer p-2 rounded hover:bg-gray-100 text-sm";
            summary.textContent = paper;

            const topicList = document.createElement("ul");
            topicList.className = "ml-3 mt-1 space-y-1 border-l-2 border-indigo-100 pl-2";

            Object.keys(topics).forEach(topic => {
                const li = document.createElement("li");
                const btn = document.createElement("button");
                btn.className = "text-left text-xs text-gray-600 hover:text-indigo-600 hover:bg-indigo-50 w-full p-1.5 rounded transition";
                btn.textContent = topic;
                btn.onclick = () => renderTopicData(paper, topic);
                li.appendChild(btn);
                topicList.appendChild(li);
            });

            paperHeader.appendChild(summary);
            paperHeader.appendChild(topicList);
            menuContainer.appendChild(paperHeader);
        }

        function renderTopicData(paper, topic) {
            document.getElementById("welcomeMessage").classList.add("hidden");
            const outputDiv = document.getElementById("output");

            const data = pyqDatabase[paper][topic];

            if (!data) {
                outputDiv.innerHTML = `<p class="text-gray-500">Topic details are being updated.</p>`;
                outputDiv.classList.remove("hidden");
                return;
            }

            let themesHtml = data.themes.map(t => `<li class="ml-4 list-disc text-sm text-gray-700 my-1">${t}</li>`).join("");
            let dimensionsHtml = data.dimensions.map(d => `<li class="ml-4 list-disc text-sm text-gray-700 my-1">${d}</li>`).join("");
            
            let pyqsHtml = data.pyqs.map(q => `
                <div class="mb-3 p-3 bg-indigo-50 border-l-4 border-indigo-600 rounded">
                    <div class="flex justify-between items-center text-xs text-indigo-900 font-bold mb-1">
                        <span>Year: ${q.year}</span>
                        <span class="bg-indigo-200 px-2 py-0.5 rounded text-indigo-800">${q.marks}</span>
                    </div>
                    <p class="text-sm text-gray-800">${q.text}</p>
                </div>
            `).join("");

            outputDiv.innerHTML = `
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">${paper}</span>
                <h2 class="text-xl font-bold text-gray-900 mb-4">${topic}</h2>

                <h3 class="text-md font-bold text-indigo-900 mt-4 mb-2">Recurrent Themes</h3>
                <ul class="mb-4">${themesHtml}</ul>

                <h3 class="text-md font-bold text-indigo-900 mt-4 mb-2">Key Dimensions to Prepare</h3>
                <ul class="mb-4">${dimensionsHtml}</ul>

                <h3 class="text-md font-bold text-indigo-900 mt-4 mb-2">Mapped Past Year Questions</h3>
                <div>${pyqsHtml}</div>
            `;

            outputDiv.classList.remove("hidden");
        }
    </script>
</body>
</html>
